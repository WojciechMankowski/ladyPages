<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Jak zamienić wiadomość z Teams w zadanie w Planerze | Wojciech Mankowski</title>
    <meta name="description" content="Instrukcja krok po kroku: jak zmienić wiadomość z Microsoft Teams w zadanie w Plannerze. Materiał dla osób zapisanych na listę." />

    <!-- Ustawienie motywu przed renderem, żeby nie było mignięcia ciemny/jasny -->
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'light' || (!saved && !prefersDark)) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>

    <div id="app"></div>
    <script type="module" src="/src/dodatek.ts"></script>
  </body>
</html>
